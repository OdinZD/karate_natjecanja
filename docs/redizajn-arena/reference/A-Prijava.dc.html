<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0C11}
a{color:#D9FF3D}a:hover{color:#F3F5F9}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #D9FF3D;outline-offset:2px}
button{font:inherit;cursor:pointer}
@keyframes ar-slab{from{transform:translateX(160px) skewX(-14deg)}to{transform:translateX(0) skewX(-14deg)}}
@keyframes ar-card{from{opacity:0;transform:translateY(24px) skewY(1.5deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;background:repeating-linear-gradient(-55deg,#0A0C11 0 16px,#0D1018 16px 17px);color:#F3F5F9;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:40px 16px;box-sizing:border-box">
  <div aria-hidden="true" style="position:absolute;right:8%;top:-10%;width:18%;min-width:120px;height:120%;background:#E8202E;transform:skewX(-14deg);animation:ar-slab .9s cubic-bezier(.2,.8,.2,1) both"></div>
  <div aria-hidden="true" style="position:absolute;right:-6%;top:-10%;width:16%;min-width:110px;height:120%;background:#2C62F0;transform:skewX(-14deg);animation:ar-slab .9s cubic-bezier(.2,.8,.2,1) .1s both"></div>

  <div style="position:relative;width:100%;max-width:440px;background:#121621;border:1px solid #262D3F;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:ar-card .6s cubic-bezier(.2,.8,.2,1) .2s both">
    <div style="display:flex;align-items:center;gap:12px;padding:22px 24px 0">
      <span aria-hidden="true" style="width:34px;height:34px;display:block;background:linear-gradient(135deg,#E8202E 0 50%,#2C62F0 50% 100%);clip-path:polygon(20% 0,100% 0,80% 100%,0 100%)"></span>
      <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:20px;letter-spacing:.06em">ORGANIZACIJA NATJECANJA</span>
    </div>
    <div style="padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px">
      <h1 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:56px;line-height:.9">PRIJAVA</h1>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.08em;color:#A0A8BA">E-POŠTA
        <input type="email" autocomplete="username" placeholder="ime@klub.hr" style="min-height:48px;padding:0 12px;background:#0A0C11;border:1px solid #3A4257;color:#F3F5F9;font:inherit;font-size:16px;letter-spacing:0">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.08em;color:#A0A8BA">
        <span style="display:flex;justify-content:space-between">LOZINKA<a href="#" style="letter-spacing:0;font-size:13px;font-weight:600">Zaboravljena lozinka?</a></span>
        <span style="display:flex;min-height:48px;background:#0A0C11;border:1px solid #3A4257">
          <input type="password" autocomplete="current-password" style="flex:1;min-width:0;padding:0 12px;border:0;background:transparent;color:#F3F5F9;font:inherit;font-size:16px;letter-spacing:0;outline:none">
          <button type="button" aria-label="Prikaži lozinku" style="width:48px;border:0;border-left:1px solid #262D3F;background:transparent;color:#A0A8BA;display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer"><input type="checkbox" style="width:18px;height:18px;accent-color:#D9FF3D">Zapamti me</label>
      <button style="min-height:52px;border:0;background:#D9FF3D;color:#0A0C11;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)">PRIJAVI SE</button>
      <div aria-hidden="true" style="display:flex;align-items:center;gap:10px;font-size:12px;color:#8C94A6"><span style="flex:1;height:1px;background:#262D3F"></span>ILI<span style="flex:1;height:1px;background:#262D3F"></span></div>
      <button style="min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #3A4257;background:transparent;color:#F3F5F9;font-weight:600;font-size:15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M15 8l2 2"></path></svg>Prijava passkeyem</button>
    </div>
    <div style="padding:14px 24px;border-top:1px solid #262D3F;font-size:13px;color:#A0A8BA">Prijava je samo za organizatore i operatere tatamija. <a href="#" style="font-weight:600">Rezultati su javni →</a></div>
  </div>
</div>
