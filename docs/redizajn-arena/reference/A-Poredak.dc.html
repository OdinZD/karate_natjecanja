<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Arena · Poredak klubova</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0C11}
a{color:#F3F5F9;text-decoration:none}a:hover{color:#D9FF3D}
a:focus-visible{outline:3px solid #D9FF3D;outline-offset:2px}
@keyframes ar-in{from{opacity:0;transform:translateX(-22px) skewX(-8deg)}to{opacity:1;transform:none}}
@keyframes ar-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;overflow:hidden;background:#0A0C11;color:#F3F5F9;font-family:Inter,system-ui,sans-serif">

  <header style="height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;border-bottom:1px solid #262D3F">
    <a href="#" aria-label="Sva natjecanja" style="width:44px;height:44px;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;letter-spacing:.03em;text-transform:uppercase">Zimski kup Zadra 2026</span>
  </header>
  <nav aria-label="Odjeljci natjecanja" style="display:flex;gap:4px;overflow-x:auto;padding:0 8px;border-bottom:1px solid #262D3F;background:#0D1018">
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Ždrijeb</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Satnica</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Rezultati</a>
    <a href="#" aria-current="page" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:inset 0 -4px 0 #D9FF3D">Poredak</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Natjecatelji</a>
  </nav>

  <section style="padding:18px 16px 0;display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:40px;line-height:1">POREDAK KLUBOVA</h1>
    <p style="margin:0;font-size:13px;color:#A0A8BA;line-height:1.45">Redoslijed: zlato, pa srebro, pa bronca. Klubovi s istim medaljama dijele mjesto.</p>
  </section>

  <section aria-label="Poredak" style="padding:16px 16px 0">
    <div style="display:grid;grid-template-columns:44px minmax(0,1fr) 32px 32px 32px 40px;align-items:center;gap:6px;padding:0 0 8px;border-bottom:1px solid #262D3F;font-size:11px;color:#A0A8BA;letter-spacing:.1em">
      <span>MJ.</span><span>KLUB</span>
      <span aria-label="Zlato" style="justify-self:center;width:16px;height:16px;border-radius:50%;background:#E9B949"></span>
      <span aria-label="Srebro" style="justify-self:center;width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:3px solid #C9CFDB"></span>
      <span aria-label="Bronca" style="justify-self:center;width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:3px dotted #C98A55"></span>
      <span style="text-align:right">UK.</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid #1A2030;animation:ar-in .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{r.delay}}">
        <div style="display:grid;grid-template-columns:44px minmax(0,1fr) 32px 32px 32px 40px;align-items:center;gap:6px">
          <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;text-align:center;background:{{r.rankBg}};color:{{r.rankFg}};transform:skewX(-10deg)">{{r.rank}}</span>
          <span style="font-weight:{{r.w}};font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.club}}</span>
          <span style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:14px">{{r.g}}</span>
          <span style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:14px">{{r.s}}</span>
          <span style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:14px">{{r.b}}</span>
          <span style="text-align:right;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px">{{r.t}}</span>
        </div>
        <div aria-hidden="true" style="margin-left:50px;display:flex;height:4px;gap:2px;width:{{r.barW}};transform-origin:left;animation:ar-bar .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{r.barDelay}}">
          <span style="flex:{{r.g}} 0 0;background:#E9B949"></span><span style="flex:{{r.s}} 0 0;background:#C9CFDB"></span><span style="flex:{{r.b}} 0 0;background:#C98A55"></span>
        </div>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['KK Optimist',6,4,5],['KK Jadran',4,3,6],['KK Sokol',4,3,6],['KK Zrinski',3,5,2],['KK Mladost',2,2,4],['KK Neretva',1,3,3],['KK Split',1,1,2]];
    const max = 15;
    let rank = 0, prev = null;
    return {
      rows: data.map(([club, g, s, b], i) => {
        const key = g + '-' + s + '-' + b;
        if (key !== prev) { rank = i + 1; prev = key; }
        const t = g + s + b;
        return { club, g, s, b, t, rank: String(rank),
          rankBg: rank === 1 ? '#D9FF3D' : '#1A2030', rankFg: rank === 1 ? '#0A0C11' : '#F3F5F9',
          w: rank === 1 ? 700 : 600,
          barW: Math.round(t / max * 100 * 0.82) + '%',
          delay: (i * 0.07).toFixed(2) + 's', barDelay: (0.3 + i * 0.07).toFixed(2) + 's' };
      })
    };
  }
}
</script>
</body>
</html>
