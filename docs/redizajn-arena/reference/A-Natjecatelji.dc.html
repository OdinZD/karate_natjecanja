<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Arena · Natjecatelji</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0C11}
a{color:#F3F5F9;text-decoration:none}a:hover{color:#D9FF3D}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #D9FF3D;outline-offset:2px}
button{font:inherit;cursor:pointer}
@keyframes ar-in{from{opacity:0;transform:translateX(-22px) skewX(-8deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:1100px;overflow:hidden;background:#0A0C11;color:#F3F5F9;font-family:Inter,system-ui,sans-serif">

  <header style="height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;border-bottom:1px solid #262D3F">
    <a href="#" aria-label="Sva natjecanja" style="width:44px;height:44px;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;letter-spacing:.03em;text-transform:uppercase">Zimski kup Zadra 2026</span>
  </header>
  <nav aria-label="Odjeljci natjecanja" style="display:flex;gap:4px;overflow-x:auto;padding:0 8px;border-bottom:1px solid #262D3F;background:#0D1018">
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Detalji</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Kategorije</a>
    <a href="#" aria-current="page" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:inset 0 -4px 0 #D9FF3D">Natjecatelji</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Ždrijeb</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Satnica</a>
  </nav>

  <section style="padding:16px 16px 0;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <h1 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:40px;line-height:1">NATJECATELJI</h1>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A0A8BA">241</span>
    </div>
    <label style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;background:#121621;border:1px solid #262D3F">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A8BA" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <span style="position:absolute;left:-9999px">Ime ili prezime</span>
      <input placeholder="Ime ili prezime" style="flex:1;min-width:0;border:0;background:transparent;color:#F3F5F9;font:inherit;font-size:16px;outline:none">
    </label>
    <button style="min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#121621;border:1px solid #262D3F;color:#F3F5F9;text-align:left">
      <span style="display:flex;flex-direction:column"><span style="font-size:11px;color:#A0A8BA;letter-spacing:.12em">KLUB</span><span style="font-weight:600;font-size:15px">Svi klubovi (18)</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </section>

  <section style="padding:12px 0 0">
    <sc-for list="{{letters}}" as="L" hint-placeholder-count="3">
      <div>
        <div style="padding:6px 16px;background:#0D1018;border-top:1px solid #262D3F;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:18px;color:#D9FF3D;letter-spacing:.08em">{{L.l}}</div>
        <sc-for list="{{L.people}}" as="p" hint-placeholder-count="3">
          <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid #1A2030;animation:ar-in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{p.delay}}">
            <span aria-hidden="true" style="flex:none;width:40px;height:40px;display:grid;place-items:center;background:#1A2030;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:18px;transform:skewX(-10deg)">{{p.ini}}</span>
            <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1">
              <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:700;font-size:15px">{{p.name}}</span><span style="font-size:12px;color:#A0A8BA;white-space:nowrap">{{p.club}}</span></div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                <sc-for list="{{p.cats}}" as="c" hint-placeholder-count="2">
                  <a href="#" style="min-height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #3A4257;font-size:12px"><span style="font-family:'JetBrains Mono',monospace;color:#A0A8BA">{{c.t}}</span>{{c.n}}</a>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
    <div style="padding:16px">
      <button style="width:100%;min-height:48px;border:1px solid #3A4257;background:transparent;color:#F3F5F9;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:18px;letter-spacing:.08em;transform:skewX(-10deg)">UČITAJ JOŠ</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    let k = 0;
    const p = (name, club, cats) => ({ name, club, ini: name.split(' ').map((w) => w[0]).join(''), delay: ((k++) * 0.06).toFixed(2) + 's', cats: cats.map(([t, n]) => ({ t, n })) });
    return {
      letters: [
        { l: 'B', people: [ p('Ivan Barić', 'KK Jadran', [['T1','Kumite −52 kg'],['T2','Kata']]), p('Lana Babić', 'KK Jadran', [['T2','Kata U12']]), p('Leon Bašić', 'KK Mladost', [['T1','Kumite −52 kg']]) ] },
        { l: 'Ć', people: [ p('Filip Ćosić', 'KK Jadran', [['T1','Kumite −52 kg']]) ] },
        { l: 'G', people: [ p('Jakov Grgić', 'KK Sokol', [['T1','Kumite −52 kg'],['T2','Kata']]) ] },
        { l: 'H', people: [ p('Mia Horvat', 'KK Optimist', [['T2','Kata U12'],['T4','Kumite −35 kg']]) ] }
      ]
    };
  }
}
</script>
</body>
</html>
