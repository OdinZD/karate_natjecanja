<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Arena · Konzola, prazna i završna stanja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#05070B}
a{color:#D9FF3D}a:hover{color:#F3F5F9}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #D9FF3D;outline-offset:2px}
@keyframes ar-in{from{opacity:0;transform:translateY(18px) skewY(2deg)}to{opacity:1;transform:none}}
@keyframes ar-spin{to{transform:rotate(360deg)}}
@keyframes ar-dash{to{stroke-dashoffset:-24}}
@keyframes ar-medal{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes ar-pulse{0%{box-shadow:0 0 0 0 rgba(217,255,61,.7)}70%{box-shadow:0 0 0 8px rgba(217,255,61,0)}100%{box-shadow:0 0 0 0 rgba(217,255,61,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:1250px;height:844px;display:flex;gap:40px;background:#05070B;font-family:Inter,system-ui,sans-serif;color:#F3F5F9">

  <sc-for list="{{phones}}" as="ph" hint-placeholder-count="3">
    <div style="width:390px;height:844px;flex:none;display:flex;flex-direction:column;background:#0A0C11;overflow:hidden">
      <header style="height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;border-bottom:1px solid #262D3F">
        <span style="width:44px;height:44px;display:grid;place-items:center" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg></span>
        <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:28px;letter-spacing:.04em">TATAMI 1</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#A0A8BA"><span aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:#3DDC84"></span>Povezano</span>
      </header>
      <div style="padding:10px 12px 0;flex:none">
        <button style="width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#121621;border:1px solid #262D3F;color:#F3F5F9;text-align:left">
          <span style="display:flex;flex-direction:column"><span style="font-size:11px;color:#A0A8BA;letter-spacing:.1em">KATEGORIJA</span><span style="font-weight:700;font-size:15px">{{ph.cat}}</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 20px 0;animation:ar-in .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{ph.delay}}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A0A8BA;letter-spacing:.1em">{{ph.tag}}</span>
        <h2 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:52px;line-height:.9">{{ph.title}}</h2>
        <p style="margin:0;font-size:15px;line-height:1.5;color:#C9CFDB">{{ph.text}}</p>

        <sc-if value="{{ph.isNoDraw}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;align-items:center;gap:12px;padding:14px;border:1px dashed #3A4257">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A0A8BA" stroke-width="2" aria-hidden="true" style="animation:ar-spin 2.4s linear infinite"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
            <span style="font-size:13px;color:#A0A8BA">Stranica se osvježava sama svakih 10 s.</span>
          </div>
        </sc-if>

        <sc-if value="{{ph.isWaiting}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
              <div style="padding:10px;background:#121621;border:1px solid #262D3F;display:flex;flex-direction:column;gap:4px"><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#A0A8BA">BORBA #6</span><span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#D9FF3D"><span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:#D9FF3D;animation:ar-pulse 1.6s infinite"></span>u tijeku</span><span style="font-size:12px;color:#C9CFDB">Marić – Barić</span></div>
              <div style="padding:10px;background:#121621;border:1px solid #262D3F;display:flex;flex-direction:column;gap:4px"><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#A0A8BA">BORBA #7</span><span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#9DB8FF"><span aria-hidden="true" style="width:9px;height:9px;background:#5B8CFF;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></span>čeka</span><span style="font-size:12px;color:#C9CFDB">Ćosić – Grgić</span></div>
            </div>
            <svg width="100%" height="40" viewBox="0 0 350 40" aria-hidden="true"><path d="M88 0 V20 H262 V0 M175 20 V40" fill="none" stroke="#3A4257" stroke-width="2" stroke-dasharray="6 6" style="animation:ar-dash 1s linear infinite"></path></svg>
            <div style="padding:12px;border:2px dashed #3A4257;text-align:center;font-size:14px;color:#A0A8BA">Finale · Pobjednik #6 – Pobjednik #7</div>
          </div>
        </sc-if>

        <sc-if value="{{ph.isDone}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;flex-direction:column;border-top:1px solid #262D3F">
            <sc-for list="{{ph.podium}}" as="p" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid #1A2030">
                <span aria-label="{{p.label}}" style="width:30px;height:30px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:16px;background:{{p.bg}};border:{{p.border}};color:{{p.fg}};animation:ar-medal .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:{{p.delay}}">{{p.n}}</span>
                <span style="display:flex;flex-direction:column"><span style="font-weight:600;font-size:14px">{{p.name}}</span><span style="font-size:12px;color:#A0A8BA">{{p.club}}</span></span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="padding:16px 12px;display:flex;flex-direction:column;gap:8px;flex:none">
        <button style="min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:0;background:{{ph.ctaBg}};color:{{ph.ctaFg}};font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:20px;letter-spacing:.06em;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)">{{ph.cta}}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        <button style="min-height:44px;border:1px solid #3A4257;background:transparent;color:#F3F5F9;font-weight:600;font-size:14px">{{ph.second}}</button>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1250,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (n, name, club, i) => ({ n, name, club, label: n + '. mjesto', delay: (0.4 + i * 0.12).toFixed(2) + 's',
      bg: n === '1' ? '#E9B949' : 'transparent', fg: n === '1' ? '#0A0C11' : '#F3F5F9',
      border: n === '1' ? '0' : (n === '2' ? '3px solid #C9CFDB' : '3px dotted #C98A55') });
    const base = { isNoDraw: false, isWaiting: false, isDone: false, podium: [] };
    return {
      phones: [
        Object.assign({}, base, { isNoDraw: true, delay: '0s', cat: 'Juniori - Kumite -68 kg', tag: 'STANJE · NEMA ŽDRIJEBA',
          title: 'JOŠ NEMA ŽDRIJEBA', text: 'Administrator još nije generirao ždrijeb za ovu kategoriju. Kad ga generira, prva borba se pojavi ovdje.',
          cta: 'DRUGA KATEGORIJA', ctaBg: '#F3F5F9', ctaFg: '#0A0C11', second: 'Osvježi sada' }),
        Object.assign({}, base, { isWaiting: true, delay: '.12s', cat: 'Kadeti - Kumite -52 kg', tag: 'STANJE · ČEKA NATJECATELJE',
          title: 'ČEKA POBJEDNIKE', text: 'Sljedeća borba na ovom tatamiju ovisi o borbama koje još nisu gotove.',
          cta: 'DRUGA KATEGORIJA', ctaBg: '#F3F5F9', ctaFg: '#0A0C11', second: 'Poništi zadnji rezultat' }),
        Object.assign({}, base, { isDone: true, delay: '.24s', cat: 'Kadeti - Kumite -57 kg', tag: 'STANJE · KATEGORIJA ZAVRŠENA',
          title: 'KATEGORIJA ZAVRŠENA', text: 'Poredak je objavljen na javnoj stranici.',
          podium: [m('1','Dario Vidović','KK Jadran',0), m('2','Toni Lovrić','KK Optimist',1), m('3','Dino Šarić','KK Sokol',2), m('3','Bruno Kalinić','KK Zrinski',3)],
          cta: 'SLJEDEĆA: KADETI -63 KG', ctaBg: '#D9FF3D', ctaFg: '#0A0C11', second: 'Poništi zadnji rezultat' })
      ]
    };
  }
}
</script>
</body>
</html>
