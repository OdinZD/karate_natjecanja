<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Arena · Detalji natjecanja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0C11}
a{color:#F3F5F9;text-decoration:none}a:hover{color:#D9FF3D}
a:focus-visible,button:focus-visible{outline:3px solid #D9FF3D;outline-offset:2px}
@keyframes ar-in{from{opacity:0;transform:translateX(-28px) skewX(-8deg)}to{opacity:1;transform:none}}
@keyframes ar-pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes ar-pulse{0%{box-shadow:0 0 0 0 rgba(10,12,17,.6)}70%{box-shadow:0 0 0 9px rgba(10,12,17,0)}100%{box-shadow:0 0 0 0 rgba(10,12,17,0)}}
@keyframes ar-stripe{from{background-position:0 0}to{background-position:40px 0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:1300px;overflow:hidden;background:#0A0C11;color:#F3F5F9;font-family:Inter,system-ui,sans-serif">

  <header style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #262D3F">
    <a href="#" style="display:flex;align-items:center;gap:10px;min-height:44px">
      <span aria-hidden="true" style="width:26px;height:26px;display:block;background:linear-gradient(135deg,#E8202E 0 50%,#2C62F0 50% 100%);clip-path:polygon(20% 0,100% 0,80% 100%,0 100%)"></span>
      <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;letter-spacing:.06em">NATJECANJA</span>
    </a>
    <button aria-label="Promijeni temu" style="width:44px;height:44px;border-radius:10px;border:1px solid #262D3F;background:#121621;color:#F3F5F9;display:grid;place-items:center;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
  </header>

  <section style="position:relative;padding:16px 16px 20px;overflow:hidden;background:repeating-linear-gradient(-55deg,#0A0C11 0 14px,#0D1018 14px 15px)">
    <div aria-hidden="true" style="position:absolute;right:-40px;top:0;width:120px;height:100%;background:#E8202E;transform:skewX(-14deg)"></div>
    <div aria-hidden="true" style="position:absolute;right:-105px;top:0;width:100px;height:100%;background:#2C62F0;transform:skewX(-14deg)"></div>
    <div style="position:relative;display:flex;flex-direction:column;gap:10px;max-width:290px">
      <a href="#" style="display:flex;align-items:center;gap:6px;font-size:13px;color:#A0A8BA;min-height:32px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Sva natjecanja</a>
      <h1 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:50px;line-height:.88;text-transform:uppercase;animation:ar-in .8s cubic-bezier(.2,.8,.2,1) both">Zimski kup<br>Zadra 2026</h1>
      <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#C9CFDB"><span style="font-family:'JetBrains Mono',monospace">SUB 13.12. · 09:00</span><span>SD Višnjik, Zadar</span></div>
    </div>
  </section>

  <nav aria-label="Odjeljci natjecanja" style="display:flex;gap:4px;overflow-x:auto;padding:0 8px;border-top:1px solid #262D3F;border-bottom:1px solid #262D3F;background:#0D1018">
    <a href="#" aria-current="page" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:inset 0 -4px 0 #D9FF3D">Detalji</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Kategorije</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Natjecatelji</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Ždrijeb</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Satnica</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Rezultati</a>
    <a href="#" style="min-height:48px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#A0A8BA;white-space:nowrap">Poredak</a>
  </nav>

  <a href="#" style="margin:16px 16px 0;min-height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#D9FF3D;color:#0A0C11;background-image:repeating-linear-gradient(-55deg,rgba(10,12,17,.06) 0 10px,transparent 10px 20px);background-size:40px 100%;animation:ar-stripe 1.2s linear infinite">
    <span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#0A0C11;animation:ar-pulse 1.6s infinite"></span>
    <span style="display:flex;flex-direction:column;flex:1"><span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1">NATJECANJE JE U TIJEKU</span><span style="font-size:13px;font-weight:600">3 tatamija u borbi · prati satnicu</span></span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>

  <section style="padding:24px 16px 0;display:flex;flex-direction:column;gap:8px">
    <h2 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:800;font-size:24px;letter-spacing:.04em">KADA I GDJE</h2>
    <dl style="margin:0;display:flex;flex-direction:column">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:baseline;min-height:44px;padding:10px 0;border-top:1px solid #262D3F;box-sizing:border-box">
          <dt style="font-size:12px;letter-spacing:.1em;color:#A0A8BA">{{f.k}}</dt>
          <dd style="margin:0;font-size:15px;font-weight:600">{{f.v}}</dd>
        </div>
      </sc-for>
    </dl>
  </section>

  <section style="padding:24px 16px 0;display:flex;flex-direction:column;gap:10px">
    <h2 style="margin:0;font-family:'Big Shoulders',Impact,sans-serif;font-weight:800;font-size:24px;letter-spacing:.04em">U BROJKAMA</h2>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{numbers}}" as="n" hint-placeholder-count="5">
        <div style="display:flex;flex-direction:column;gap:2px;padding:12px;background:#121621;border:1px solid #262D3F;grid-column:{{n.span}}">
          <span style="font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:48px;line-height:.95;animation:ar-pop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:{{n.delay}}">{{n.v}}</span>
          <span style="font-size:12px;letter-spacing:.1em;color:#A0A8BA">{{n.k}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding:24px 16px 0;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
      <a href="#" style="min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:1px solid #3A4257;font-family:'Big Shoulders',Impact,sans-serif;font-weight:900;font-size:22px;letter-spacing:.06em;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);animation:ar-in .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{l.delay}}">{{l.t}}<span style="display:flex;align-items:center;gap:8px;font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:0;color:#A0A8BA">{{l.sub}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="2.2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      facts: [
        { k: 'DATUM', v: 'Subota, 13. 12. 2026.' }, { k: 'POČETAK', v: '09:00' }, { k: 'MJESTO', v: 'SD Višnjik, Zadar' },
        { k: 'ORGANIZATOR', v: 'KK Optimist' }, { k: 'ROK PRIJAVE', v: '10. 12. 2026. (zatvoreno)' }, { k: 'STATUS', v: 'U tijeku' }
      ],
      numbers: [
        { k: 'KATEGORIJE', v: '125', span: 'auto', delay: '.1s' }, { k: 'PRIJAVE', v: '386', span: 'auto', delay: '.18s' },
        { k: 'NATJECATELJI', v: '241', span: 'auto', delay: '.26s' }, { k: 'KLUBOVI', v: '18', span: 'auto', delay: '.34s' },
        { k: 'TATAMIJI', v: '4', span: '1 / -1', delay: '.42s' }
      ],
      links: [
        { t: 'ŽDRIJEB', sub: '125 kategorija', delay: '.2s' }, { t: 'SATNICA', sub: 'kraj ~16:20', delay: '.28s' }, { t: 'REZULTATI', sub: '41 završeno', delay: '.36s' }
      ]
    };
  }
}
</script>
</body>
</html>
